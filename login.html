<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Literasi MTs YAPIKA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-full flex flex-col justify-center font-sans text-slate-800 antialiased py-12">

    <div class="max-w-md mx-auto px-4 w-full">
        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xl">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-md">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Masuk ke Literasi MTs YAPIKA</h2>
                <p class="text-slate-500 text-sm mt-1">Akses akun peminjaman dan koleksi digital Anda</p>
            </div>

            <form id="loginForm" autocomplete="on" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username / Nomor Anggota</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Nomor anggota atau username" class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kata Sandi</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition">
                    Masuk Sekarang
                </button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-500">
                Kembali ke <a href="index.html" class="text-blue-600 font-semibold hover:underline">Beranda Utama</a>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="ui-tailwind.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
